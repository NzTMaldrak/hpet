name: HPET
version: '${version}'
main: it.heron.hpet.main.PetPlugin
api-version: '26.2'
description: 'The packet based pet plugin'
softdepend: [packetevents, PlaceholderAPI, HeadDatabase, Vault, SuperVanish, PremiumVanish, CMI, MythicMobs, ItemsAdder, ModelEngine, HeadDB]
commands:
  hpet:
    description: Main HPET command
    usage: /hpet [help|select|remove|update|rename|buy|addlevel|removelevel|setlevel|level|reload]
    permission: pet.command
  reload:
    description: Reload all HPET resources and runtime modules
    usage: /reload
    permission: pet.reload
permissions:
  pet.version:
    default: true
  pet.command:
    default: false
  pet.rename:
    default: false
  pet.rename.color:
    default: op
  pet.reload:
    default: op
  pet.remove:
    default: false
  pet.remove.others:
    default: op
  pet.update:
    default: false
  pet.update.others:
    default: op
  pet.level:
    default: false
  pet.level.others:
    default: op
  pet.buy:
    default: false
  pet.buy.others:
    default: op
  pet.select.others:
    default: op
  pet.addlevel:
    default: op
  pet.addlevel.others:
    default: op
  pet.removelevel:
    default: op
  pet.removelevel.others:
    default: op
  pet.setlevel:
    default: op
  pet.setlevel.others:
    default: op
