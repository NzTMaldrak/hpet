      noprice: "&eQuesto pet non è acquistabile!"
      notenough: "&cNon hai abbastanza denaro!"
      permissioncommand: "lp user %player% permission set pet.use.%petname%"
      bought: "&aHai acquistato un nuovo pet!"
    respawn: "&aPet rigenerato!"
    remove: "&cPet rimosso!"
    spawned: "&aPet generato!"
