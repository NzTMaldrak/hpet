# File completo della lingua italiana di HPET.
# Puoi modificare liberamente ogni testo e colore.
# Colori classici: &0-&f | Formati: &l grassetto, &o corsivo, &n sottolineato, &m barrato, &r reset.
# Non rimuovere i placeholder tra parentesi graffe, ad esempio {pet}, {player}, {level} e {sender}.
messages:
  gui:
    name: "&a&lPETS"
    select:
      can: "&a&lCLICCA PER SELEZIONARE"
      cannot: "&c&lPET BLOCCATO!"
      success: "&aPet selezionato: &f{pet}"
    remove:
      success: "&aPet rimosso: &f{pet}"
    home:
      title: "&6HPET - Categorie"
      all_pets:
        name: "&6&lTutti i pet"
        lore:
          - "&7Mostra tutti i pet disponibili"
      rename:
        name: "&a&lRinomina il pet"
        lore:
          - "&7Clicca e scrivi in chat"
          - "&7il nuovo nome del pet"
      respawn:
        name: "&a&lRigenera il pet"
        lore:
          - "&7Ricrea il pet attualmente attivo"
      remove:
        name: "&c&lRimuovi il pet"
