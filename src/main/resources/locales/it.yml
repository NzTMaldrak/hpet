        empty: "&cIl nome del pet non può essere vuoto."
        success: "&aPet rinominato in: &r{name}"
        chat_prompt: "&eScrivi in chat il nuovo nome del pet. Digita &cannulla &eper uscire."
        cancelled: "&eRinomina del pet annullata."
        expired: "&cTempo scaduto: rinomina del pet annullata."
      help:
        header: "&6&lComandi HPET:"
        help: "&e/hpet help &7- Mostra questo elenco"
        select: "&e/hpet select <pet> [giocatore] &7- Seleziona un pet"
        remove: "&e/hpet remove [giocatore] &7- Rimuove il pet attivo"
        update: "&e/hpet update [giocatore] &7- Rigenera il pet attivo"
        buy: "&e/hpet buy <pet> [giocatore] &7- Acquista un pet"
        addlevel: "&e/hpet addlevel <quantità> [giocatore] &7- Aggiunge livelli"
        removelevel: "&e/hpet removelevel <quantità> [giocatore] &7- Rimuove livelli"
        setlevel: "&e/hpet setlevel <livello> [giocatore] &7- Imposta il livello"
        level: "&e/hpet level [giocatore] &7- Mostra il livello"
        rename: "&e/hpet rename <nome> &7- Rinomina il pet attivo"
        reload: "&e/hpet reload &7- Ricarica completamente HPET"
      reload:
        no_permission: "&cNon hai il permesso di ricaricare HPET."
        start: "&eRicaricamento completo di HPET in corso..."
        success: "&aHPET ricaricato completamente."
        failed: "&cImpossibile completare il reload di HPET. Controlla la console."
      remove:
        success:
          self: "&aPet rimosso correttamente."
          other: "&aHai rimosso il pet di {player}."
          received: "&e{sender} ha rimosso il tuo pet."
      update:
        error:
          failed: "&cNon è stato possibile rigenerare il pet di {player}."
        success:
          self: "&aPet rigenerato correttamente."
          other: "&aHai rigenerato il pet di {player}."
          received: "&a{sender} ha rigenerato il tuo pet."
      buy:
        error:
          not_found: "&cIl pet '{petType}' non esiste."
          failed: "&cNon è stato possibile acquistare il pet '{petType}' per {player}."
          no_price: "&cQuesto pet non può essere acquistato."
          not_enough_money: "&cNon hai abbastanza denaro per acquistare '{petType}'."
          already_owned: "&c{player} possiede già il pet '{petType}'."
        wip: "&eAcquisto del pet '{petType}' per {player}..."
        success:
          self: "&aHai acquistato il pet '{petType}'."
          other: "&aHai acquistato il pet '{petType}' per {player}."
          received: "&a{sender} ha acquistato il pet '{petType}' per te."
      level:
        add:
          error:
            invalid_amount: "&cLa quantità deve essere maggiore di zero."
          success:
            self: "&aHai aggiunto {amount} livelli. Nuovo livello: {level}."
            other: "&aHai aggiunto {amount} livelli al pet di {player}. Nuovo livello: {level}."
            received: "&a{sender} ha aggiunto {amount} livelli al tuo pet. Nuovo livello: {level}."
        remove:
          error:
            invalid_amount: "&cLa quantità deve essere maggiore di zero."
          success:
            self: "&aHai rimosso {amount} livelli. Nuovo livello: {level}."
            other: "&aHai rimosso {amount} livelli dal pet di {player}. Nuovo livello: {level}."
            received: "&e{sender} ha rimosso {amount} livelli dal tuo pet. Nuovo livello: {level}."
        set:
          error:
            negative_level: "&cIl livello non può essere negativo."
          success:
            self: "&aLivello del pet impostato a {level}."
            other: "&aLivello del pet di {player} impostato a {level}."
            received: "&a{sender} ha impostato il livello del tuo pet a {level}."
        show:
          self: "&eIl livello attuale del tuo pet è {level}."
          other: "&eIl livello attuale del pet di {player} è {level}."
          received: "&e{sender} ha controllato il livello del tuo pet: {level}."
