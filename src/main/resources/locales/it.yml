      locked: "&cNon hai sbloccato questo pet."
      packet_events: "&cPacketEvents 2.13.0 o superiore non è attivo."
      spawn_failed: "&cImpossibile generare {pet}. Controlla la console."
      rename_permission: "&cNon hai il permesso di rinominare il pet."
      remove_permission: "&cNon hai il permesso di rimuovere il pet."
