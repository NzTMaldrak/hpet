messages:
  # Keep GUI section from original
  gui:
    name: "<green><bold>PETS</bold></green>"
    select:
      can: "<green><bold>CLICK TO SELECT</bold></green>"
      cannot: "<red><bold>PET LOCKED!</bold></red>"
      success: "<green>Pet selected: <white>{pet}</white></green>"
    remove:
      success: "<green>Pet removed: <white>{pet}</white></green>"
    home:
      title: "<gold>HPET - Categories</gold>"
      all_pets:
        name: "<gold><bold>All pets</bold></gold>"
        lore:
          - "<gray>Show every available pet</gray>"
      rename:
        name: "<green><bold>Rename pet</bold></green>"
        lore:
          - "<gray>Click and type the new</gray>"
          - "<gray>pet name in chat</gray>"
      respawn:
        name: "<green><bold>Respawn pet</bold></green>"
        lore:
          - "<gray>Respawn the active pet</gray>"
      remove:
        name: "<red><bold>Remove pet</bold></red>"
        lore:
          - "<gray>Remove the active pet</gray>"
    pets:
      title: "<gold>HPET - {group}</gold>"
      all_title: "All pets"
      back:
        name: "<red><bold>Back to categories</bold></red>"
        lore: []
      previous_page:
        name: "<red><bold>Previous page</bold></red>"
        lore: []
      next_page:
        name: "<green><bold>Next page</bold></green>"
        lore: []
    category:
      name: "<green><bold>{group}</bold></green>"
      lore:
        - ""
        - "<gray>{count} configured pets</gray>"
        - "<green><bold>Click to open</bold></green>"
    pet:
      click_to_select: "<green>Click to select</green>"
    error:
      locked: "<red>You have not unlocked this pet.</red>"
      packet_events: "<red>PacketEvents 2.13.0 or newer is not active.</red>"
      spawn_failed: "<red>Could not spawn {pet}. Check the console.</red>"
      rename_permission: "<red>You cannot rename pets.</red>"
      remove_permission: "<red>You cannot remove pets.</red>"

  # Error messages used by helper methods
  error:
    # Used in getTargetPlayer helper
    specify_target: "<red>You must specify a target player from console.</red>"
    # Used in getUserPet helper
    no_active_pet: "<red><player> does not have an active pet.</red>" # {player} is the target player's name
    no_permission: "&cYou do not have permission &e{permission}&c."
    packet_events: "&cPacketEvents 2.13.0 or newer is not installed or active. Pets cannot be used."
    invalid_number: "&cEnter a valid number."
    world_disabled: "&cYou cannot activate pets in world &e{world}&c."
    combat: "&cYou cannot spawn a pet while in combat!"

  # Command-specific messages
  command:
    hpet:
      main:
        # Message for players running the base command
        player: "<green>Opening pet GUI... (Not implemented yet)</green>"
        # Message for console running the base command
        console: "<yellow>Usage: /hpet <subcommand> [args]\nAvailable subcommands: select, remove, update, buy, addlevel, removelevel, setlevel, level</yellow>"

      select:
        error:
          not_found: "<red>Pet type '<petType>' not found.</red>" # {petType} from command argument
          # {petType} from command arg, {player} is target name (Requires MessagesHandler modification for players)
          failed: "<red>Failed to select the '<petType>' pet for <player>. An error occurred.</red>"
        success:
          # {pet} is sender's newly selected pet name (from buildDictionary)
          self: "<green>You have selected the '<pet>' pet.</green>"
          # {petType} from command arg, {player} is target name (Requires MessagesHandler modification for players)
          other: "<green>You have selected the '<petType>' pet for <player>.</green>"
          # {sender} is command sender's name (Requires MessagesHandler modification)
          # {pet} is target's newly selected pet name (from buildDictionary)
          received: "<green><sender> has selected the '<pet>' pet for you.</green>"

      rename:
        only_player: "&cThe rename command can only be used by a player."
        usage: "&eUse: &c/hpet rename <new name>"
        no_permission: "&cYou cannot rename pets."
        empty: "&cThe pet name cannot be empty."
        success: "&aPet renamed to: &r{name}"
        chat_prompt: "<yellow>Type the new pet name in chat. Type <red>cancel</red> to exit.</yellow>"
        cancelled: "<yellow>Pet rename cancelled.</yellow>"
        expired: "<red>Time expired: pet rename cancelled.</red>"

      help:
        header: "&6&lHPET Commands:"
        help: "&e/hpet help &7- Show this list"
        select: "&e/hpet select <pet> [player] &7- Select a pet"
        remove: "&e/hpet remove [player] &7- Remove the active pet"
        update: "&e/hpet update [player] &7- Respawn the active pet"
        buy: "&e/hpet buy <pet> [player] &7- Buy a pet"
        addlevel: "&e/hpet addlevel <amount> [player] &7- Add levels"
        removelevel: "&e/hpet removelevel <amount> [player] &7- Remove levels"
        setlevel: "&e/hpet setlevel <level> [player] &7- Set the level"
        level: "&e/hpet level [player] &7- Show the level"
        rename: "&e/hpet rename <name> &7- Rename the active pet"
        reload: "&e/hpet reload &7- Fully reload HPET"

      reload:
        no_permission: "&cYou cannot reload HPET."
        start: "&eReloading all HPET resources..."
        success: "&aHPET fully reloaded."
        failed: "&cCould not reload HPET. Check the console."

      remove:
        success:
          self: "<green>Your pet has been removed.</green>"
          # {player} is target name (Requires MessagesHandler modification for players)
          other: "<green>The pet for <player> has been removed.</green>"
          # {sender} is command sender's name (Requires MessagesHandler modification)
          received: "<green><sender> has removed your pet.</green>"

      update:
        error:
          # {player} is target name (Requires MessagesHandler modification for players)
          failed: "<red>Failed to update (respawn) the pet for <player>.</red>"
        success:
          self: "<green>Your pet has been updated (respawned).</green>"
          # {player} is target name (Requires MessagesHandler modification for players)
          other: "<green>The pet for <player> has been updated (respawned).</green>"
          # {sender} is command sender's name (Requires MessagesHandler modification)
          received: "<green><sender> has updated (respawned) your pet.</green>"

      buy:
        error:
          # {petType} from command arg
          not_found: "<red>Pet type '<petType>' not found.</red>"
          # {petType} from command arg, {player} is target name (Requires MessagesHandler modification for players) - Generic failure
          failed: "<red>Failed to buy the '<petType>' pet for <player>. (Reason: See console/logs)</red>"
          # Add these messages when implementing the buy logic TODOs
          no_price: "<red>This pet does not have a price and cannot be bought this way.</red>"
          not_enough_money: "<red>You do not have enough money to buy the '<petType>' pet.</red>" # {petType} from command arg
          already_owned: "<red><player> already owns the '<petType>' pet.</red>" # {player} is target name, {petType} from command arg
        # Message used for the TODO placeholder in the buy command
        # {petType} from command arg, {player} is target name (Requires MessagesHandler modification for players)
        wip: "<yellow>Buy command logic not fully implemented. Attempting to buy '<petType>' for <player>...</yellow>"
        success:
          # {petType} from command arg
          self: "<green>You have successfully bought the '<petType>' pet!</green>"
          # {petType} from command arg, {player} is target name (Requires MessagesHandler modification for players)
          other: "<green>You have successfully bought the '<petType>' pet for <player>.</green>"
          # {sender} is command sender's name (Requires MessagesHandler modification)
          # {petType} from command arg (Requires MessagesHandler modification)
          received: "<green><sender> has bought the '<petType>' pet for you!</green>"

      level: # Group for level commands
        add:
          error:
            invalid_amount: "<red>Amount must be a positive number.</red>"
          success:
            # {amount} from command arg, {level} is sender's new level (Requires MessagesHandler modification for players)
            self: "<green>Your pet's level increased by <amount>. New level: <level>.</green>"
            # {player} is target name, {amount} from command arg, {level} is target's new level (Requires MessagesHandler modification for players)
            other: "<green><player>'s pet's level increased by <amount>. New level: <level>.</green>"
            # {sender} (Requires MessagesHandler modification), {amount} (Requires MessagesHandler modification), {level} is target's new level (Requires MessagesHandler modification - buildDictionary might be outdated)
            received: "<green><sender> has added <amount> levels to your pet. New level: <level>.</green>"

        remove:
          error:
            invalid_amount: "<red>Amount must be a positive number.</red>"
          success:
            # {amount} from command arg, {level} is sender's new level (Requires MessagesHandler modification for players)
            self: "<green>Your pet's level decreased by <amount>. New level: <level>.</green>"
            # {player} is target name, {amount} from command arg, {level} is target's new level (Requires MessagesHandler modification for players)
            other: "<green><player>'s pet's level decreased by <amount>. New level: <level>.</green>"
            # {sender} (Requires MessagesHandler modification), {amount} (Requires MessagesHandler modification), {level} is target's new level (Requires MessagesHandler modification - buildDictionary might be outdated)
            received: "<green><sender> has removed <amount> levels from your pet. New level: <level>.</green>"

        set:
          error:
            negative_level: "<red>Level cannot be negative.</red>"
          success:
            # {level} is sender's new level (Requires MessagesHandler modification for players)
            self: "<green>Your pet's level has been set to <level>.</green>"
            # {player} is target name, {level} is target's new level (Requires MessagesHandler modification for players)
            other: "<green><player>'s pet's level has been set to <level>.</green>"
            # {sender} (Requires MessagesHandler modification), {level} is target's new level (Requires MessagesHandler modification - buildDictionary might be outdated)
            received: "<green><sender> has set your pet's level to <level>.</green>"

        show:
          # {level} is sender's current pet level (from buildDictionary)
          self: "<green>Your current pet's level is <level>.</green>"
          # {player} is target name (Requires MessagesHandler modification for players)
          # {level} is target's current pet level (from buildDictionary)
          other: "<green><player>'s current pet's level is <level>.</green>"
          # {sender} is command sender's name (Requires MessagesHandler modification)
          # {level} is target's current pet level (from buildDictionary)
          received: "<green><sender> checked your pet's level. It is <level>.</green>"
